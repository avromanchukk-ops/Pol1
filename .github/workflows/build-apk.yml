name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build web UI
        run: |
          mkdir -p fonts/onest && cd fonts/onest && npm pack @fontsource/onest@5 --silent && tar xzf fontsource-onest-*.tgz && cd ../..
          python3 web/build.py
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Полиця · збірка ${{ github.run_number }}
          body: Автоматична збірка. Завантажте Polytsia.apk і встановіть на Android.
          files: android/app/build/outputs/apk/debug/Polytsia.apk
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { echo '```'; tail -n 120 build.log 2>/dev/null || echo 'no build.log'; echo '```'; } > fail.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file fail.md
